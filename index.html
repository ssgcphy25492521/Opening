<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Day Launch Ceremony</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040814;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      cursor: pointer;
    }

    /* Reveal Background (Behind the Gates) */
    #reveal-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0e224d 0%, #040814 80%);
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    #fireworks-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .event-content {
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.5s ease-out, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .event-content.visible {
      opacity: 1;
      transform: scale(1);
    }

    .event-subtitle-top {
      font-size: clamp(1.2rem, 2.5vw, 2.2rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #ffd700;
      margin-bottom: 1rem;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .event-title {
      font-size: clamp(3rem, 7vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 10%, #ffd700 60%, #ff9900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
      line-height: 1.1;
    }
    
    .event-title sup {
      font-size: 0.45em;
      vertical-align: super;
      line-height: 0;
      letter-spacing: 0.02em;
      background: inherit;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .event-subtitle-bottom {
      font-size: clamp(1rem, 2vw, 1.8rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #7dd3fc;
      margin-top: 1.5rem;
      text-shadow: 0 0 12px rgba(125, 211, 252, 0.6);
    }

    /* Sliding Heavy Gates */
    .gate {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #07122b 0%, #0b1d42 50%, #050c1f 100%);
      z-index: 10;
      transition: transform 2.4s cubic-bezier(0.7, 0, 0.2, 1);
      display: flex;
      align-items: center;
    }

    #gate-left {
      left: 0;
      border-right: 4px solid #ffd700;
      box-shadow: 10px 0 40px rgba(0, 0, 0, 0.9);
    }

    #gate-right {
      right: 0;
      border-left: 4px solid #ffd700;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9);
    }

    #center-lock {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #ffd700;
