<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Day Launch Ceremony</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040814;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      cursor: pointer;
    }

    /* Reveal Background (Behind the Gates) */
    #reveal-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0e224d 0%, #040814 80%);
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    #fireworks-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .event-content {
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.5s ease-out, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .event-content.visible {
      opacity: 1;
      transform: scale(1);
    }

    .event-subtitle-top {
      font-size: clamp(1.2rem, 2.5vw, 2.2rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #ffd700;
      margin-bottom: 1rem;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .event-title {
      font-size: clamp(3rem, 7vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 10%, #ffd700 60%, #ff9900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
      line-height: 1.1;
    }

    .event-subtitle-bottom {
      font-size: clamp(1rem, 2vw, 1.8rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #7dd3fc;
      margin-top: 1.5rem;
      text-shadow: 0 0 12px rgba(125, 211, 252, 0.6);
    }

    /* Sliding Heavy Gates */
    .gate {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #07122b 0%, #0b1d42 50%, #050c1f 100%);
      z-index: 10;
      transition: transform 2.4s cubic-bezier(0.7, 0, 0.2, 1);
      display: flex;
      align-items: center;
    }

    #gate-left {
      left: 0;
      border-right: 4px solid #ffd700;
      box-shadow: 10px 0 40px rgba(0, 0, 0, 0.9);
    }

    #gate-right {
      right: 0;
      border-left: 4px solid #ffd700;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9);
    }

    /* Center Lock Emblem */
  #palms-overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.5vw, 35px); /* REDUCED GAP so more palms fit side-by-side */
      padding: 0 4%;
      transition: opacity 0.6s ease;
    }

    body.opened {
      cursor: default;
    }

    body.opened #gate-left {
      transform: translateX(-100%);
    }

    body.opened #gate-right {
      transform: translateX(100%);
    }

    body.opened #center-lock,
    body.opened #palms-overlay {
      opacity: 0;
      pointer-events: none;
    }

    /* Palms Container (3 Palms) */
    #palms-overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 6vw, 90px);
      padding: 0 6%;
      transition: opacity 0.6s ease;
    }

.palm-slot {
      position: relative;
      width: clamp(65px, 7.5vw, 105px);   /* EVEN SMALLER WIDTH */
      height: clamp(85px, 9.5vw, 135px);  /* EVEN SMALLER HEIGHT */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 18px;               /* Slightly tighter corner radius */
      border: 2px solid rgba(56, 189, 248, 0.45);
      background: rgba(8, 20, 48, 0.72);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      animation: pulseGlow 2.8s infinite ease-in-out;
      overflow: hidden;
      margin-top: 50vh;/* <-- INCREASE THIS NUMBER (try 35vh, 40vh, or 45vh) */
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        border-color: rgba(56, 189, 248, 0.45);
      }
      50% {
        box-shadow: 0 0 40px rgba(56, 189, 248, 0.65);
        border-color: rgba(56, 189, 248, 0.95);
      }
    }

    .palm-svg {
      width: 75%;
      height: 75%;
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
      transition: stroke 0.4s ease, filter 0.4s ease;
    }

    /* Scanning Effect */
    .scan-line {
      position: absolute;
      left: 0;
      top: -10%;
      width: 100%;
      height: 6px;
      background: #ffd700;
      box-shadow: 0 0 20px #ffd700, 0 0 40px #ffffff;
      opacity: 0;
    }

    body.scanning .palm-slot {
      animation: none;
      border-color: #ffd700;
      box-shadow: 0 0 45px rgba(255, 215, 0, 0.7);
    }

    body.scanning .palm-svg {
      stroke: #ffd700;
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 1));
    }

    body.scanning .scan-line {
      opacity: 1;
      animation: scanMove 1.4s ease-in-out infinite alternate;
    }

    @keyframes scanMove {
      0% { top: 5%; }
      100% { top: 92%; }
    }

    /* Operator Hint */
    #operator-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #cbd5e1;
      letter-spacing: 0.05em;
      transition: opacity 0.5s ease;
      white-space: nowrap;
      pointer-events: none;
    }

    #operator-hint.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Reveal Stage (Behind Gates) -->
  <div id="reveal-stage">
    <canvas id="fireworks-canvas"></canvas>
    <div class="event-content" id="event-content">
      <div class="event-subtitle-top">WELCOME TO</div>
      <div class="event-title">ST. STEPHEN'S GIRLS'COLLEGE</div>
      <div class="event-subtitle-bottom">120<sup>th</sup> ANNIVERSARY OPEN DAY</div>
    </div>
  </div>

  <!-- Heavy Sliding Gates -->
  <div id="gate-left" class="gate"></div>
  <div id="gate-right" class="gate"></div>
  <div id="center-lock"></div>

  <!-- 6 VIP Handprints Overlay -->
  <div id="palms-overlay">
    <div class="palm-slot">

        <circle cx="46" cy="76" r="10" stroke-dasharray="3 3" />
      </svg>
    </div>

     <div class="palm-slot">
      <div class="scan-line"></div>

        <path d="M32 62 V28 a4 4 0 0 1 8 0 V56 M42 54 V18 a4 4 0 0 1 8 0 V54 M52 54 V21 a4 4 0 0 1 8 0 V56 M62 58 V32 a4 4 0 0 1 8 0 V68 C70 88 60 104 45 104 C31 104 22 92 18 76 L12 58 a4 4 0 0 1 7 -4 L27 68 V62 Z" />
        <circle cx="46" cy="76" r="10" stroke-dasharray="3 3" />
      </svg>
    </div>

       <div class="palm-slot">
      <div class="scan-line"></div>
      <svg class="palm-svg" viewBox="0 0 100 120">
        <path d="M32 62 V28 a4 4 0 0 1 8 0 V56 M42 54 V18 a4 4 0 0 1 8 0 V54 M52 54 V21 a4 4 0 0 1 8 0 V56 M62 58 V32 a4 4 0 0 1 8 0 V68 C70 88 60 104 45 104 C31 104 22 92 18 76 L12 58 a4 4 0 0 1 7 -4 L27 68 V62 Z" />
        <circle cx="46" cy="76" r="10" stroke-dasharray="3 3" />
      </svg>
    </div>

       <div class="palm-slot">

        <circle cx="46" cy="76" r="10" stroke-dasharray="3 3" />
      </svg>
    </div>

    <div class="palm-slot">
      <div class="scan-line"></div>
      <svg class="palm-svg" viewBox="0 0 100 120">
        <path d="M32 62 V28 a4 4 0 0 1 8 0 V56 M42 54 V18 a4 4 0 0 1 8 0 V54 M52 54 V21 a4 4 0 0 1 8 0 V56 M62 58 V32 a4 4 0 0 1 8 0 V68 C70 88 60 104 45 104 C31 104 22 92 18 76 L12 58 a4 4 0 0 1 7 -4 L27 68 V62 Z" />
        <circle cx="46" cy="76" r="10" stroke-dasharray="3 3" />
      </svg>
    </div>
  </div>


  <!-- Subtle Operator Instruction -->
  <div id="operator-hint">Click anywhere or press SPACEBAR to launch (R to reset)</div>

  <script>
    const SCAN_DURATION_MS = 2200;

    let currentState = 'IDLE'; // 'IDLE' | 'SCANNING' | 'OPENED'
    let scanTimeout = null;
    let fireworkInterval = null;

    // ==========================================
    // SYNTHESIZED SOUND EFFECTS
    // ==========================================
    let audioCtx = null;
    let noiseBuffer = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
            const bufferSize = audioCtx.sampleRate * 0.8;
            noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (err) {
        console.log("Audio not supported or blocked");
      }

      const hint = document.getElementById('operator-hint');
      if (hint) hint.classList.add('hidden');
    }

    function playScanSound() {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + (SCAN_DURATION_MS / 1000));

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (SCAN_DURATION_MS / 1000));

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + (SCAN_DURATION_MS / 1000));
      } catch (err) {}
    }

    function playGateOpenSound() {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 1.8);

        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 2.0);
      } catch (err) {}
    }

    function playFireworkBoom() {
      try {
        if (!audioCtx || !noiseBuffer) return;
        const now = audioCtx.currentTime;

        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, now);
        filter.frequency.exponentialRampToValueAtTime(80, now + 0.7);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } catch (err) {}
    }

    // ==========================================
    // FIREWORKS CANVAS ANIMATION
    // ==========================================
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.012;
        this.gravity = 0.06;
      }

      update() {
        this.vx *= 0.97;
        this.vy *= 0.97;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function createFireworkBurst() {
      const colors = ['#ffd700', '#38bdf8', '#ffffff', '#ff6b6b', '#a855f7', '#fbbf24'];
      const x = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
      const y = Math.random() * (canvas.height * 0.5) + (canvas.height * 0.1);
      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 65; i++) {
        particles.push(new Particle(x, y, color));
      }
      playFireworkBoom();
    }

    function animateFireworks() {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      animationFrameId = requestAnimationFrame(animateFireworks);
    }

    function startFireworks() {
      if (!animationFrameId) {
        animateFireworks();
      }
      createFireworkBurst();
      setTimeout(createFireworkBurst, 300);
      fireworkInterval = setInterval(createFireworkBurst, 300);
    }

    function stopFireworks() {
      clearInterval(fireworkInterval);
      fireworkInterval = null;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      particles = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // ==========================================
    // CEREMONY SEQUENCE CONTROLLERS
    // ==========================================
    function triggerLaunchSequence() {
      if (currentState !== 'IDLE') return;
      currentState = 'SCANNING';

      document.body.classList.add('scanning');
      playScanSound();

      scanTimeout = setTimeout(() => {
        currentState = 'OPENED';
        document.body.classList.remove('scanning');
        document.body.classList.add('opened');
        document.getElementById('event-content').classList.add('visible');

        playGateOpenSound();
        startFireworks();
      }, SCAN_DURATION_MS);
    }

    function resetCeremony() {
      clearTimeout(scanTimeout);
      stopFireworks();
      currentState = 'IDLE';

      document.body.classList.remove('scanning', 'opened');
      document.getElementById('event-content').classList.remove('visible');
    }

    function handleScreenTrigger() {
      initAudio();
      triggerLaunchSequence();
    }

    // Bind event listeners globally
    document.addEventListener('click', handleScreenTrigger);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        handleScreenTrigger();
      } else if (e.code === 'KeyR' || e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        resetCeremony();
      }
    });

  </script>
