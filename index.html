<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Day Launch Ceremony</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #040814;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
  }

  /* Reveal Background (Behind the Gates) */
  #reveal-stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #0e224d 0%, #040814 80%);
    z-index: 1;
    text-align: center;
    padding: 2rem;
  }

  #fireworks-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .event-content {
    position: relative;
    z-index: 3;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 1.5s ease-out, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .event-content.visible {
    opacity: 1;
    transform: scale(1);
  }

  .event-subtitle-top {
    font-size: clamp(1.2rem, 2.5vw, 2.2rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #ffd700;
    margin-bottom: 1rem;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
  }

  .event-title {
    font-size: clamp(3rem, 7vw, 6.5rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 10%, #ffd700 60%, #ff9900 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
    line-height: 1.1;
  }

  .event-subtitle-bottom {
    font-size: clamp(1rem, 2vw, 1.8rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #7dd3fc;
    margin-top: 1.5rem;
    text-shadow: 0 0 12px rgba(125, 211, 252, 0.6);
  }

  /* Sliding Heavy Gates */
  .gate {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(135deg, #07122b 0%, #0b1d42 50%, #050c1f 100%);
    z-index: 10;
    transition: transform 2.4s cubic-bezier(0.7, 0, 0.2, 1);
    display: flex;
    align-items: center;
  }

  #gate-left {
    left: 0;
    border-right: 4px solid #ffd700;
    box-shadow: 10px 0 40px rgba(0, 0, 0, 0.9);
  }

  #gate-right {
    right: 0;
    border-left: 4px solid #ffd700;
    box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9);
  }

  /* Center Lock Emblem */
  #center-lock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 4px solid #ffd700;
    background: radial-gradient(circle, #132c63 0%, #060e24 100%);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255, 215, 0, 0.3);
    z-index: 12;
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }

  body.opened #gate-left {
    transform: translateX(-100%);
  }

  body.opened #gate-right {
    transform: translateX(100%);
  }

  body.opened #center-lock,
  body.opened #palms-overlay {
    opacity: 0;
    pointer-events: none;
  }

  /* Palms Container */
  #palms-overlay {
    position: absolute;
    inset: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 6%;
    transition: opacity 0.6s ease;
  }

  .palm-slot {
    position: relative;
    width: clamp(140px, 16vw, 240px);
    height: clamp(180px, 21vw, 310px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    border: 2px solid rgba(56, 189, 248, 0.35);
    background: rgba(8, 20, 48, 0.55);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
    animation: pulseGlow 2.8s infinite ease-in-out;
    overflow: hidden;
  }

  @keyframes pulseGlow {
    0%, 100% {
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
    }
    50% {
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.6);
      border-color: rgba(56, 189, 248, 0.9);
    }
  }

  .palm-svg {
    width: 75%;
    height: 75%;
    fill: none;
    stroke: #38bdf8;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
    transition: stroke 0.4s ease, filter 0.4s ease;
  }

  /* Scanning Effect */
  .scan-line {
    position: absolute;
    left: 0;
    top: -10%;
    width: 100%;
    height: 6px;
    background: #ffd700;
    box-shadow: 0 0 20px #ffd700, 0 0 40px #ffffff;
    opacity: 0;
  }

  body.scanning .palm-slot {
    animation: none;
    border-color: #ffd700;
    box-shadow: 0 0 45px rgba(255, 215, 0, 0.7);
  }

  body.scanning .palm-svg {
    stroke: #ffd700;
    filter: drop-shadow(0 0 16px rgba(255, 215, 0, 1));
  }

  body.scanning .scan-line {
    opacity: 1;
    animation: scanMove 1.4s ease-in-out infinite alternate;
  }

  @keyframes scanMove {
    0% { top: 5%; }
    100% { top: 92%; }
  }

  /* Operator Hint (Fades out on first interaction) */
  #operator-hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    color: #cbd5e1;
    letter-spacing: 0.05em;
    transition: opacity 0.5s ease;
  }

  #operator-hint.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- Reveal Stage (Behind Gates) -->
  <div id="reveal-stage">
    <canvas id="fireworks-canvas"></canvas>
    <div class="event-content" id="event-content">
      <div class="event-subtitle-top">WELCOME TO OUR</div>
      <div class="event-title">GRAND OPEN DAY 2026</div>
      <div class="event-subtitle-bottom">OFFICIAL LAUNCH CEREMONY</div>
    </div>
  </div>

  <!-- Heavy Sliding Gates -->
  <div id="gate-left" class="gate"></div>
  <div id="gate-right" class="gate"></div>
  <div id="center-lock"></div>

  <!-- VIP Handprints Overlay -->
  <div id="palms-overlay"></div>

  <!-- Subtle Operator Instruction -->
  <div id="operator-hint">Click screen once to enable audio &bull; Press SPACEBAR to launch (R to reset)</div>

<script>
  // ==========================================
  // EASY CUSTOMIZATION SETTINGS
  // ==========================================
  const NUMBER_OF_PALMS = 4; // Change to 3, 4, 5, or 6
  const SCAN_DURATION_MS = 2200; // How long palms scan before gates open (in milliseconds)

  // ==========================================
  // GENERATE PALM SVG ICONS
  // ==========================================
  const palmsOverlay = document.getElementById('palms-overlay');
  const handSvgMarkup = `
    <svg class="palm-svg" viewBox="0 0 100 120">
      <path d="M32 62 V28 a4 4 0 0 1 8 0 V56 M42 54 V18 a4 4 0 0 1 8 0 V54 M52 54 V21 a4 4 0 0 1 8 0 V56 M62 58 V32 a4 4 0 0 1 8 0 V68 C70 88 60 104 45 104 C31 104 22 92 18 76 L12 58 a4 4 0 0 1 7 -4 L27 68 V62 Z" />
      <circle cx="46" cy="76" r="10" stroke-dasharray="3 3" />
    </svg>
  `;

  for (let i = 0; i < NUMBER_OF_PALMS; i++) {
    const slot = document.createElement('div');
    slot.className = 'palm-slot';
    slot.innerHTML = `<div class="scan-line"></div>` + handSvgMarkup;
    palmsOverlay.appendChild(slot);
  }

  // ==========================================
  // SYNTHESIZED SOUND EFFECTS (WEB AUDIO API)
  // ==========================================
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    document.getElementById('operator-hint').classList.add('hidden');
  }

  function playScanSound() {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + (SCAN_DURATION_MS / 1000));

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.25, now + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (SCAN_DURATION_MS / 1000));

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + (SCAN_DURATION_MS / 1000));
  }

  function playGateOpenSound() {
    initAudio();
    const now = audioCtx.currentTime;
    // Deep Bass Drop / Mechanical Whoosh
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(32, now + 1.8);

    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 2.0);
  }

  function playFireworkBoom() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.8;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(600, now);
    filter.frequency.exponentialRampToValueAtTime(80, now + 0.7);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
