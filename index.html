<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Day Launch Ceremony</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040814;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      cursor: pointer;
    }

    /* Reveal Background (Behind the Gates) */
    #reveal-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0e224d 0%, #040814 80%);
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    #fireworks-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .event-content {
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.5s ease-out, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .event-content.visible {
      opacity: 1;
      transform: scale(1);
    }

    .event-subtitle-top {
      font-size: clamp(1.2rem, 2.5vw, 2.2rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #ffd700;
      margin-bottom: 1rem;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .event-title {
      font-size: clamp(3rem, 7vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 10%, #ffd700 60%, #ff9900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
      line-height: 1.1;
    }
    
    .event-title sup {
      font-size: 0.45em;
      vertical-align: super;
      line-height: 0;
      letter-spacing: 0.02em;
      background: inherit;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .event-subtitle-bottom {
      font-size: clamp(1rem, 2vw, 1.8rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #7dd3fc;
      margin-top: 1.5rem;
      text-shadow: 0 0 12px rgba(125, 211, 252, 0.6);
    }

    /* Sliding Heavy Gates */
    .gate {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #07122b 0%, #0b1d42 50%, #050c1f 100%);
      z-index: 10;
      transition: transform 2.4s cubic-bezier(0.7, 0, 0.2, 1);
      display: flex;
      align-items: center;
    }

    #gate-left {
      left: 0;
      border-right: 4px solid #ffd700;
      box-shadow: 10px 0 40px rgba(0, 0, 0, 0.9);
    }

    #gate-right {
      right: 0;
      border-left: 4px solid #ffd700;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9);
    }

    /* Center Lock Emblem */
    #center-lock {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #ffd700;
      background: radial-gradient(circle, #132c63 0%, #060e24 100%);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255, 215, 0, 0.3);
      z-index: 12;
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }

    body.opened {
      cursor: default;
    }

    body.opened #gate-left {
      transform: translateX(-100%);
    }

    body.opened #gate-right {
      transform: translateX(100%);
    }

    body.opened #center-lock,
    body.opened #palms-overlay {
      opacity: 0;
      pointer-events: none;
    }

    /* Palms Container (6 Palms) */
    #palms-overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.5vw, 25px); 
      padding: 0 4%;
      transition: opacity 0.6s ease;
    }

    .palm-slot {
      position: relative;
      width: clamp(65px, 8vw, 110px);   
      height: clamp(85px, 10vw, 140px);  
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 14px;                
      border: 2px solid rgba(56, 189, 248, 0.45);
      background: rgba(8, 20, 48, 0.72);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      animation: pulseGlow 2.8s infinite ease-in-out;
      overflow: hidden;
      margin-top: 45vh; 
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        border-color: rgba(56, 189, 248, 0.45);
      }
      50% {
        box-shadow: 0 0 40px rgba(56, 189, 248, 0.65);
        border-color: rgba(56, 189, 248, 0.95);
      }
    }

    .palm-svg {
      width: 75%;
      height: 75%;
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
      transition: stroke 0.4s ease, filter 0.4s ease;
    }

    /* Scanning Effect */
    .scan-line {
      position: absolute;
      left: 0;
      top: -10%;
      width: 100%;
      height: 6px;
      background: #ffd700;
      box-shadow: 0 0 20px #ffd700, 0 0 40px #ffffff;
      opacity: 0;
    }

    body.scanning .palm-slot {
      animation: none;
      border-color: #ffd700;
      box-shadow: 0 0 45px rgba(255, 215, 0, 0.7);
    }

    body.scanning .palm-svg {
      stroke: #ffd700;
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 1));
    }

    body.scanning .scan-line {
      opacity: 1;
      animation: scanMove 1.4s ease-in-out infinite alternate;
    }

    @keyframes scanMove {
      0% { top: 5%; }
      100% { top: 92%; }
    }

    /* Operator Hint */
    #operator-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #cbd5e1;
      letter-spacing: 0.05em;
      transition: opacity 0.5s ease;
      white-space: nowrap;
      pointer-events: none;
    }

    #operator-hint.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Subtle Operator Instruction -->
  <div id="operator-hint">[ Click anywhere to power on audio system ]</div>

  <script>
    const SCAN_DURATION_MS = 2400;

    let currentState = 'NEEDS_INTERACTION'; // 'NEEDS_INTERACTION' | 'IDLE' | 'SCANNING' | 'OPENED'
    let scanTimeout = null;
    let fireworkInterval = null;

    // ==========================================
    // SYNTHESIZED SOUND EFFECTS
    // ==========================================
    let audioCtx = null;
    let noiseBuffer = null;
    let ambientOscillators = [];
    let ambientGain = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
            const bufferSize = audioCtx.sampleRate * 0.8;
            noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (err) {
        console.log("Audio not supported or blocked");
      }
    }

    // 1. New Pre-Launch Ambient Music
    function startAmbientMusic() {
      if (!audioCtx || ambientGain) return;
      ambientGain = audioCtx.createGain();
      ambientGain.gain.setValueAtTime(0, audioCtx.currentTime);
      ambientGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 2);
      ambientGain.connect(audioCtx.destination);

      // Deep mysterious chord: C2, G2, C3
      const freqs = [65.41, 98.00, 130.81]; 
      freqs.forEach(freq => {
        let osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;

        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 300;

        // Slow LFO to sweep the filter and make it sound "alive"
        let lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.1 + Math.random() * 0.05;
        let lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 150;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();

        osc.connect(filter);
        filter.connect(ambientGain);
        osc.start();
        ambientOscillators.push({osc, lfo});
      });
    }

    function stopAmbientMusic() {
      if (ambientGain) {
        ambientGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
        setTimeout(() => {
          ambientOscillators.forEach(nodes => { nodes.osc.stop(); nodes.lfo.stop(); });
          ambientOscillators = [];
          ambientGain = null;
        }, 1600);
      }
    }

    // 2. Scan Sound (Unchanged)
    function playScanSound() {
      try {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + (SCAN_DURATION_MS / 1000));
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (SCAN_DURATION_MS / 1000));
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + (SCAN_DURATION_MS / 1000));
      } catch (err) {}
    }

    // 3. New Grand Orchestral Opening Sound
    function playGrandOpening() {
      try {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0, now);
        masterGain.gain.linearRampToValueAtTime(0.4, now + 1.0);
        masterGain.gain.exponentialRampToValueAtTime(0.001, now + 4.5);
        masterGain.connect(audioCtx.destination);

        // Huge C Major Brass/Synth Swell: C3, G3, C4, E4, G4
        const freqs = [130.81, 196.00, 261.63, 329.63, 392.00];
        freqs.forEach(freq => {
          let osc = audioCtx.createOscillator();
          osc.type = 'square';
          osc.frequency.value = freq + (Math.random() * 1.5 - 0.75); // Slight detune for thickness
          
          let filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(150, now);
          filter.frequency.exponentialRampToValueAtTime(3500, now + 1.2);
          filter.frequency.exponentialRampToValueAtTime(100, now + 4.5);

          osc.connect(filter);
          filter.connect(masterGain);
          osc.start(now);
          osc.stop(now + 4.5);
        });
      } catch (err) {}
    }

    // 4. Enhanced Richer Firework Boom (with Sub-bass drop)

        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);

        sub.frequency.exponentialRampToValueAtTime(30, now + 0.5);
